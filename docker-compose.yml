services:
  mongodb:
    image: mongo:7
    container_name: voting-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  api:
    build: .
    container_name: voting-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/voting
      USER_INFO_ENABLED: ${USER_INFO_ENABLED:-false}
      USER_INFO_BASE_URL: ${USER_INFO_BASE_URL:-https://user-info.herokuapp.com}
      MOBILE_CALLBACK_BASE_URL: ${MOBILE_CALLBACK_BASE_URL:-http://localhost:8080}
    depends_on:
      - mongodb

volumes:
  mongodb-data:
