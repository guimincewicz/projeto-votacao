services:
  mongodb:
    image: mongo:7
    container_name: voting-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  api:
    build: .
    container_name: voting-api
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/voting
      USER_INFO_ENABLED: "false"
    depends_on:
      - mongodb

volumes:
  mongodb-data:
