services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/voting
      USER_INFO_ENABLED: "false"
    depends_on:
      - mongodb
volumes:
  mongo-data:
