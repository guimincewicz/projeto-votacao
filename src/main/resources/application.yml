spring:
  application:
    name: api-votacao
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/voting}
      auto-index-creation: true

external:
  user-info:
    enabled: ${USER_INFO_ENABLED:false}
    base-url: ${USER_INFO_BASE_URL:https://user-info.herokuapp.com}

mobile:
  callback-base-url: ${MOBILE_CALLBACK_BASE_URL:http://localhost:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
